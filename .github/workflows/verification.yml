name: Verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: 41 11 * * 1
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Source lint and installable package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up isolated Python build tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/http-guard-python"
          "$RUNNER_TEMP/http-guard-python/bin/python" -m pip install --disable-pip-version-check --requirement Build/requirements.txt
          printf '%s\n' "$RUNNER_TEMP/http-guard-python/bin" >> "$GITHUB_PATH"
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Lint current source and test tooling
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          find Classes Configuration Tests Build -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l ext_localconf.php
          php -l ext_emconf.php
          python3 -m compileall -q Build/Scripts Build/Fixtures Tests/HttpGuard/Integration
      - name: Verify deterministic extension archive
        shell: bash
        run: |
          set -euo pipefail
          # These controls need no PHP development dependencies. The development
          # quality job runs the complete suite, including the real CaptainHook detector.
          python3 -m unittest Tests.Build.test_build_extension Tests.Build.test_coverage_paths Tests.Build.test_wire_lifecycle -v
          python3 Build/Scripts/build-extension.py --output "$RUNNER_TEMP/nr_http_guard.zip"
          python3 Build/Scripts/build-extension.py --output "$RUNNER_TEMP/repeated.zip"
          cmp "$RUNNER_TEMP/nr_http_guard.zip" "$RUNNER_TEMP/repeated.zip"
          unzip -Z1 "$RUNNER_TEMP/nr_http_guard.zip" > "$RUNNER_TEMP/archive-members.txt"
          if grep -E '(^|/)(vendor|Tests|Build|\.github|evidence|verification|specification)/|\.(key|pem)$' "$RUNNER_TEMP/archive-members.txt"; then
            echo 'Unexpected development dependencies, private keys or evidence in installable archive' >&2
            exit 1
          fi
      - name: Preserve installable archive and member hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installable-extension
          path: |
            ${{ runner.temp }}/nr_http_guard.zip
            ${{ runner.temp }}/nr_http_guard.zip.manifest.json
          if-no-files-found: error
          retention-days: 14
  native-transport:
    name: Native transport (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.coverage-id == '8.2.0' && 60 || 15 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Guzzle 7.15.3
            core: '14.3.8'
            guzzle: '7.15.3'
            promises: '2.5.2'
            psr7: '2.13.0'
            coverage-id: '7.15.3'
          - label: Guzzle 7.15.5
            core: '14.3.8'
            guzzle: '7.15.5'
            promises: '2.5.3'
            psr7: '2.13.1'
            coverage-id: '7.15.5'
          - label: Guzzle 8.2.0
            core: '14.3.8'
            guzzle: '8.2.0'
            promises: '3.0.2'
            psr7: '3.1.0'
            coverage-id: '8.2.0'
          - label: Minimum Guzzle 7.15.2
            core: 14.3.8
            guzzle: 7.15.2
            promises: 2.5.1
            psr7: 2.13.0
            coverage-id: minimum-g7
          - label: Latest compatible TYPO3 13 / Guzzle 7
            core: '^13.4.36'
            guzzle: '^7.15.2'
            promises: '^2.5.1'
            psr7: '^2.13'
            coverage-id: latest-core13-g7
          - label: Latest compatible TYPO3 13 / Guzzle 8
            core: '^13.4.36'
            guzzle: '^8.2'
            promises: '^3.0.2'
            psr7: '^3.1'
            coverage-id: latest-core13-g8
          - label: Latest compatible TYPO3 14 / Guzzle 7
            core: '^14.3.8'
            guzzle: '^7.15.2'
            promises: '^2.5.1'
            psr7: '^2.13'
            coverage-id: latest-core14-g7
          - label: Latest compatible TYPO3 14 / Guzzle 8
            core: '^14.3.8'
            guzzle: '^8.2'
            promises: '^3.0.2'
            psr7: '^3.1'
            coverage-id: latest-core14-g8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up isolated Python build tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/http-guard-python"
          "$RUNNER_TEMP/http-guard-python/bin/python" -m pip install --disable-pip-version-check --requirement Build/requirements.txt
          printf '%s\n' "$RUNNER_TEMP/http-guard-python/bin" >> "$GITHUB_PATH"
      - name: Set up PHP and coverage
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: curl, dom, intl, mbstring, pdo_sqlite, sodium, xml
          coverage: ${{ matrix.coverage-id == '8.2.0' && 'xdebug' || 'pcov' }}
          tools: composer:v2
      - name: Install dependency combination
        env:
          CAPTAINHOOK_DISABLE: 'true'
          TEST_GUZZLE: ${{ matrix.guzzle }}
          TEST_PROMISES: ${{ matrix.promises }}
          TEST_PSR7: ${{ matrix.psr7 }}
          TEST_CORE: ${{ matrix.core }}
        shell: bash
        run: |
          set -euo pipefail
          composer require --no-update "typo3/cms-core:$TEST_CORE" \
            "guzzlehttp/guzzle:$TEST_GUZZLE" "guzzlehttp/promises:$TEST_PROMISES" \
            "guzzlehttp/psr7:$TEST_PSR7"
          composer config --no-plugins allow-plugins.typo3/cms-composer-installers true
          composer config --no-plugins allow-plugins.typo3/class-alias-loader true
          composer install --prefer-dist --no-progress --no-interaction
      - name: Analyze resolved kernel and TYPO3 signatures
        env:
          TEST_CORE: ${{ matrix.core }}
          HTTP_GUARD_TEST_AUTOLOAD: ${{ github.workspace }}/.Build/vendor/autoload.php
        shell: bash
        run: |-
          composer ci:test:php:phpstan
      - name: Start isolated synthetic HTTP, TLS and mTLS targets
        shell: bash
        run: |
          set -euo pipefail
          printf '10.23.4.12 nss-only-guard.test\n' | sudo tee -a /etc/hosts >/dev/null
          bash Tests/HttpGuard/Integration/prepare-wire.sh
          for address in 203.0.115.100 203.0.115.101 10.23.4.12; do
            ready=false
            for attempt in {1..30}; do
              if curl --noproxy '*' --silent --fail "http://$address:8091/reset" >/dev/null; then
                ready=true
                break
              fi
              printf 'Waiting for %s (attempt %s)\n' "$address" "$attempt"
              sleep 1
            done
            "$ready"
          done
      - name: Exercise Unit and actual native wire behavior
        env:
          HTTP_GUARD_TEST_AUTOLOAD: ${{ github.workspace }}/.Build/vendor/autoload.php
          XDEBUG_MODE: coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coverage"
          .Build/vendor/bin/phpunit --configuration phpunit.xml \
            --coverage-clover "$RUNNER_TEMP/coverage/full-clover.xml" \
            --log-junit "$RUNNER_TEMP/coverage/junit.xml"
          python3 Build/Scripts/normalize-clover.py "$RUNNER_TEMP/coverage/full-clover.xml"
      - name: Enforce native mutation thresholds for the changed source or full qualification
        if: matrix.coverage-id == '8.2.0'
        env:
          HTTP_GUARD_TEST_AUTOLOAD: ${{ github.workspace }}/.Build/vendor/autoload.php
          XDEBUG_MODE: coverage
          MUTATION_EVENT: ${{ github.event_name }}
          MUTATION_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mutation_scope=()
          if [[ "$MUTATION_EVENT" == pull_request ]]; then
            [[ "$MUTATION_DIFF_BASE" =~ ^[0-9a-f]{40}$ ]] || { printf 'Invalid mutation comparison commit.\n' >&2; exit 2; }
            git cat-file -e "$MUTATION_DIFF_BASE^{commit}"
            changed_source=$(git diff --name-only --diff-filter=AMR "$MUTATION_DIFF_BASE" HEAD -- ':(glob)Classes/**/*.php')
            if [[ -z "$changed_source" ]]; then
              printf 'No production PHP added, modified or renamed; Unit and native behavior passed, mutation measurement is skipped.\n'
              exit 0
            fi
            mutation_scope=(--git-diff-filter=AMR --git-diff-base="$MUTATION_DIFF_BASE")
          fi
          .Build/vendor/bin/infection --configuration infection.native.json5 --threads=1 \
            --with-uncovered --with-timeouts --only-covering-test-cases \
            --no-progress --show-mutations=0 "${mutation_scope[@]}"
      - name: Preserve mutation results including failed thresholds
        if: always() && matrix.coverage-id == '8.2.0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-mutation-results
          path: .Build/reports/infection-native*
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve fresh test coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-coverage-${{ matrix.coverage-id }}
          path: ${{ runner.temp }}/coverage
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable targets and synthetic keys
        if: always()
        shell: bash
        run: |
          docker rm -f http-guard-production-public-a http-guard-production-public-b \
            http-guard-production-private http-guard-production-loopback || true
          docker network rm http-guard-production-public http-guard-production-private \
            http-guard-production-v6 || true
          rm -rf Tests/HttpGuard/Integration/certificates
  coverage-upload:
    name: Coverage upload
    needs: native-transport
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Load the verified main source tree for coverage path mapping
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: Classes
      # This main-branch job reads verified source metadata and measured XML only.
      # Repository code is never executed here; the upload token is scoped to its final action.
      - name: Download current main coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-coverage-8.2.0
          path: coverage
      - name: Upload measured Unit and transport coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/full-clover.xml
          flags: combined-unit-native
          disable_search: true
          fail_ci_if_error: true
          override_commit: ${{ github.sha }}
          override_branch: ${{ github.ref_name }}
          slug: ${{ github.repository }}
          disable_file_fixes: true
  gate:
    name: Verification gate
    needs:
      - package
      - native-transport
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Require every dependency to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
