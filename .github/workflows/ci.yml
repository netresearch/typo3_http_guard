name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  php:
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5"]'
      extra-matrix: |-
        [{"core":"13.4.36","guzzle":"7.15.5","promises":"2.5.3","psr7":"2.13.1"},
         {"core":"13.4.36","guzzle":"8.2.0","promises":"3.0.2","psr7":"3.1.0"},
         {"core":"14.3.8","guzzle":"7.15.5","promises":"2.5.3","psr7":"2.13.1"},
         {"core":"14.3.8","guzzle":"8.2.0","promises":"3.0.2","psr7":"3.1.0"}]
      matrix-exclude: '[{"php":"8.2","extra":{"core":"14.3.8"}}]'
      extensions: curl, dom, intl, mbstring, pdo_sqlite, sodium, xml
      timeout-minutes: 15
      # Static commands below are committed code, never event-supplied input.
      # Resolve fresh transitive packages within the qualified Core/SDK tuple.
      # Patched Core releases resolve SVG sanitizer 1.0.0 with advisory blocking enabled.
      pre-install-cmd: |
        set -euo pipefail
        python3 Build/Scripts/check-composer-qualification.py --core "$MATRIX_CORE" \
          --sdk "$MATRIX_GUZZLE" "$MATRIX_PROMISES" "$MATRIX_PSR7"
        composer require --no-update "typo3/cms-core:$MATRIX_CORE" \
          "guzzlehttp/guzzle:$MATRIX_GUZZLE" "guzzlehttp/promises:$MATRIX_PROMISES" \
          "guzzlehttp/psr7:$MATRIX_PSR7"
        composer config --no-plugins allow-plugins.typo3/cms-composer-installers true
        composer config --no-plugins allow-plugins.typo3/class-alias-loader true
      phpstan-cmd: |-
        composer ci:test:php:phpstan
      phpunit-cmd: composer ci:test:php:unit
      run-composer-audit: false
      # Full transport coverage is captured separately with dedicated wire fixtures.
      upload-coverage-codecov: false
      upload-coverage-artifact: false
  documentation:
    uses: netresearch/typo3-ci-workflows/.github/workflows/docs.yml@main
    permissions:
      contents: read
  workflow-lint:
    uses: netresearch/.github/.github/workflows/lint-workflows.yml@main
    permissions:
      contents: read
  dco:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: netresearch/.github/.github/workflows/dco.yml@main
    permissions:
      contents: read
      pull-requests: read
  gate:
    name: CI gate
    needs:
      - php
      - documentation
      - workflow-lint
      - dco
      - quality
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Require build checks and the applicable sign-off check
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg event "$EVENT_NAME" '
            keys == ["dco", "documentation", "php", "quality", "workflow-lint"]
            and .php.result == "success"
            and .quality.result == "success"
            and .documentation.result == "success"
            and .["workflow-lint"].result == "success"
            and .dco.result == (
              if $event == "pull_request" or $event == "merge_group" then "success"
              elif $event == "push" or $event == "workflow_dispatch" then "skipped"
              else "unsupported-event"
              end
            )
          ' <<< "$RESULTS"
  quality:
    name: Development quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CAPTAINHOOK_DISABLE: "true"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up isolated Python build tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/http-guard-python"
          "$RUNNER_TEMP/http-guard-python/bin/python" -m pip install --disable-pip-version-check --requirement Build/requirements.txt
          printf '%s\n' "$RUNNER_TEMP/http-guard-python/bin" >> "$GITHUB_PATH"
      - name: Set up reference PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.5"
          extensions: curl, dom, intl, mbstring, pdo_sqlite, sodium, xml
          coverage: none
          tools: composer:v2
      - name: Resolve Composer cache
        id: composer-cache
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache downloaded packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: ${{ runner.os }}-quality-php85-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-quality-php85-
      - name: Install development dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Enforce agent guidance and local hook contracts
        run: |
          composer check:harness
          python3 -m unittest discover -s Tests/Build -p 'test_*.py' -v
      - name: Run shared style and deterministic quality controls
        run: composer check:local
      - name: Check safe modernization proposals
        run: composer ci:test:php:rector
      - name: Check architecture boundaries
        run: composer ci:test:php:architecture
      - name: Run seeded fuzz properties
        run: composer ci:test:php:fuzz
      - name: Measure policy overhead on the CI reference
        run: composer ci:test:php:performance
        env:
          HTTP_GUARD_PERFORMANCE_REFERENCE: github-actions ubuntu-24.04 / PHP 8.5
      - name: Preserve reference measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: policy-performance-reference
          path: .Build/reports/policy-performance.json
          if-no-files-found: error
          retention-days: 14
