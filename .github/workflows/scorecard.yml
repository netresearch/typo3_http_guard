name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    uses: netresearch/.github/.github/workflows/scorecard.yml@main
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
