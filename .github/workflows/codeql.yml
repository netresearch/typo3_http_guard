name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling-analysis:
    uses: netresearch/.github/.github/workflows/codeql.yml@main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      # CodeQL does not support PHP. This scans Actions and Python tooling only.
      languages: actions,python
