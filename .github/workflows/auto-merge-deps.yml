name: Auto-merge dependency PRs

on:
  # auto-merge only calls `gh pr merge` via the reusable with the base-repo
  # token; it never checks out or runs PR head code, so pull_request_target
  # (required for a write token on Dependabot/Renovate fork PRs) is safe here.
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions: {}

# The job only approves and merges; it never needs the Actions cache, so it
# gets no cache token at all (actionlint cache-call-unrestricted).
cache-mode: none

jobs:
  auto-merge:
    uses: netresearch/.github/.github/workflows/auto-merge-deps.yml@main
    permissions:
      contents: write
      pull-requests: write
    # Merge with the org App so the merge commit gets a CI run (#450).
    # Only these two secrets are passed, not `secrets: inherit`.
    secrets:
      merge-app-id: ${{ secrets.PROJECT_APP_ID }}
      merge-app-private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
