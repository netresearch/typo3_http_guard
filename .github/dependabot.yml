version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      qualified-runtime-tuple:
        patterns:
          - typo3/cms-core
          - guzzlehttp/guzzle
          - guzzlehttp/promises
          - guzzlehttp/psr7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
# Historical evidence locks are deliberately not configured as update targets.
# Runtime tuple PRs require qualification and a human review; no auto-merge.
