# Extension-specific configuration consumed by the installed shared runner.
PHPUNIT_CONFIG="${PHPUNIT_CONFIG:-phpunit.xml}"
UNIT_TESTSUITE="${UNIT_TESTSUITE:-Unit}"
php_image() {
    local selected=${HTTP_GUARD_PHP_IMAGE:-${IMAGE_PHP:-}}
    if [[ -n "$selected" ]]; then
        [[ $selected =~ @sha256:[0-9a-f]{64}$ ]] || { printf 'Use a digest-pinned HTTP_GUARD_PHP_IMAGE.\n' >&2; return 2; }
        printf '%s' "$selected"
        return
    fi
    case "$1" in
        8.2) printf '%s' 'ghcr.io/typo3/core-testing-php82@sha256:ad40d77ca458e4b66cb5c6b58d9197478b3400a8d2e61abf1b49d18ca9aa6baf' ;;
        8.3) printf '%s' 'ghcr.io/typo3/core-testing-php83@sha256:9379789e9445b89094b6c814ae6fc6c2ebe8f3360b390b8789140c290a71caae' ;;
        8.4) printf '%s' 'ghcr.io/typo3/core-testing-php84@sha256:b0051c4c9fe93cf83e45446e7e6f9f3034509d97cc27d4bb9374c869e36d8692' ;;
        8.5) printf '%s' 'ghcr.io/typo3/core-testing-php85@sha256:53df750b7e68ccce8da03a03bfe7cb57d732308b932f2ea92b1fd31679626bc6' ;;
        *) printf 'Set HTTP_GUARD_PHP_IMAGE to a verified digest for PHP %s.\n' "$1" >&2; return 2 ;;
    esac
}
suite_native() {
    HTTP_GUARD_NATIVE_PHP_IMAGE="$IMAGE_PHP" HTTP_GUARD_EXPECTED_PHP="$PHP_VERSION" \
        HTTP_GUARD_EXPECTED_CORE="${TYPO3_CONSTRAINT:-${HTTP_GUARD_EXPECTED_CORE:-}}" \
        bash "$PROJECT_ROOT/Build/Scripts/run-native-tests.sh" "$@"
}

# The official shared runner calls suite_<name> for project-specific suites.
# Core wire witnesses are on fixed, isolated bridges; the generic Composer
# bridge cannot reach them. Only these explicit Functional entries use the
# host network, with the same pinned PHP image and project-bounded fixture.
suite_http_guard_functional() (
    set -euo pipefail
    [[ $# -ge 4 ]] || { printf 'Functional hook requires suite, fixture and runtime expectations.\n' >&2; exit 2; }
    local functional_suite=$1 fixture_path=$2 expected_php=$3 expected_core=$4
    shift 4
    case "$functional_suite" in
        integration|classic|mode) ;;
        *) printf 'Unsupported Functional hook suite.\n' >&2; exit 2 ;;
    esac
    [[ $IMAGE_PHP =~ @sha256:[0-9a-f]{64}$ ]] || { printf 'Functional PHP image must be digest pinned.\n' >&2; exit 2; }
    local functional_root fixture_loader run_dir container_id operation
    local -a owned_ids=() command=() container_options=()
    functional_root=$(cd -- "$PROJECT_ROOT" && pwd -P)
    case "$functional_root" in
        *[[:space:]:]*) printf 'The shared project mount requires a checkout path without whitespace or colons.\n' >&2; exit 2 ;;
    esac
    cd "$functional_root"
    [[ "$fixture_path" != *$'\n'* && "$fixture_path" != *$'\r'* ]] || { printf 'Fixture paths must not contain line breaks.\n' >&2; exit 2; }
    [[ -d "$fixture_path" && -f "$fixture_path/vendor/autoload.php" ]] || { printf 'Prepared Functional fixture and loader are required.\n' >&2; exit 2; }
    fixture_path=$(cd -- "$fixture_path" && pwd -P)
    fixture_loader=$(realpath "$fixture_path/vendor/autoload.php")
    [[ "$fixture_path" == "$functional_root" || "$fixture_path" == "$functional_root/"* ]] && \
        [[ "$fixture_loader" == "$functional_root/"* ]] || { printf 'Functional fixture and loader must stay inside the project mount.\n' >&2; exit 2; }
    run_dir=$(mktemp -d -t http-guard-functional.XXXXXXXXXX)
    cleanup_functional() {
        local result=$1 cleanup_failed=0 owned_id cid_file candidate
        trap - EXIT
        # Recover only validated IDs written into this run's private directory,
        # including a create command that failed after writing its CID file.
        for cid_file in "$run_dir/probe.cid" "$run_dir/entry.cid"; do
            if [[ -f "$cid_file" ]]; then
                candidate=$(cat "$cid_file")
                if [[ $candidate =~ ^[0-9a-f]{64}$ ]] && [[ " ${owned_ids[*]} " != *" $candidate "* ]]; then
                    owned_ids+=("$candidate")
                fi
            fi
        done
        for owned_id in "${owned_ids[@]}"; do
            if ! "$CONTAINER_BIN" rm --force "$owned_id" >/dev/null 2>&1; then
                printf 'Unable to remove an owned Functional container.\n' >&2
                cleanup_failed=1
            fi
        done
        if ! rm -f -- "$run_dir/probe.cid" "$run_dir/entry.cid" || ! rmdir -- "$run_dir"; then
            printf 'Unable to remove the private Functional run directory.\n' >&2
            cleanup_failed=1
        fi
        [[ $result -eq 0 ]] || return "$result"
        return "$cleanup_failed"
    }
    trap 'cleanup_functional "$?"' EXIT
    trap 'exit 130' INT
    trap 'exit 143' TERM
    container_options=(--network host --read-only --cap-drop ALL
        --security-opt no-new-privileges --user "$(id -u):$(id -g)"
        --tmpfs '/tmp:rw,nosuid,nodev,size=64m'
        --volume "$functional_root:$functional_root"
        --workdir "$functional_root"
        --label "http-guard.functional.run=${run_dir##*/}")
    for operation in probe entry; do
        if [[ $operation == probe ]]; then
            command=(php Build/Scripts/assert-test-runtime.php "$fixture_loader" "$expected_php" "$expected_core")
        else
            command=(bash Build/Scripts/runTests.sh -s "$functional_suite" -f "$fixture_path" -- "$@")
        fi
        "$CONTAINER_BIN" create "${container_options[@]}" \
            --name "${run_dir##*/}-$operation" --cidfile "$run_dir/$operation.cid" \
            "$IMAGE_PHP" "${command[@]}" >/dev/null
        container_id=$(cat "$run_dir/$operation.cid")
        [[ $container_id =~ ^[0-9a-f]{64}$ ]] || { printf 'Functional container identity is invalid.\n' >&2; exit 2; }
        owned_ids+=("$container_id")
        "$CONTAINER_BIN" start --attach "$container_id"
    done
    cleanup_functional 0
)
